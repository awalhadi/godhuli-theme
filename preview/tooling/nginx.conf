# Godhuli Shop — edge proxy
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    keepalive_timeout   65s;
    client_max_body_size 10m;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    upstream shop_api {
        least_conn;
        server 10.0.1.11:8080 max_fails=3 fail_timeout=30s;
        server 10.0.1.12:8080 max_fails=3 fail_timeout=30s;
        server 10.0.1.13:8080 backup;
        keepalive 32;
    }

    server {
        listen 80;
        server_name godhuli.shop www.godhuli.shop;
        return 301 https://godhuli.shop$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name godhuli.shop;

        ssl_certificate     /etc/letsencrypt/live/godhuli.shop/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/godhuli.shop/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;

        root /srv/www/shop;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://shop_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        location ~* \.(?:css|js|woff2?|png|jpe?g|webp|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~ ^/orders/(\d+)/invoice\.pdf$ {
            rewrite ^/orders/(\d+)/invoice\.pdf$ /api/v1/orders/$1/invoice break;
            proxy_pass http://shop_api;
        }

        location = /healthz { return 200 "ok\n"; }
        location ~ /\.(?!well-known) { deny all; }
    }
}
