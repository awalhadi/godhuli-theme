# Godhuli Shop API — Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: godhuli
  labels:
    app.kubernetes.io/name: shop-api
    app.kubernetes.io/part-of: godhuli-shop
    app.kubernetes.io/version: "2.4.1"
  annotations:
    deployment.kubernetes.io/revision: "17"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-api
    spec:
      serviceAccountName: shop-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ghcr.io/godhuli/shop-api:2.4.1
          imagePullPolicy: IfNotPresent
          args: ["dist/server.js", "--cluster"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: url
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
          envFrom:
            - configMapRef:
                name: shop-config
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 3
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  namespace: godhuli
  labels:
    app.kubernetes.io/name: shop-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shop-api
  ports:
    - name: http
      port: 80
      targetPort: http
