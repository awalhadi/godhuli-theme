; Godhuli Shop — legacy desktop POS settings
; Lines starting with ; or # are comments.

[general]
app_name = Godhuli Shop POS
version = 2.4.1
locale = bn_BD
currency = BDT
debug = false

# Paths are relative to the install directory
[paths]
data_dir = C:\ProgramData\Godhuli\data
log_file = logs/pos.log
receipt_template = "templates/receipt default.txt"

[database]
host = 127.0.0.1
port = 5432
name = shop
user = pos_terminal
password = ${POS_DB_PASSWORD}
pool_size = 4
timeout_seconds = 15.5

[printer]
enabled = true
model = "Epson TM-T20III"
paper_width_mm = 80
footer = Thank you for shopping at Godhuli!

[sync]
; Upload interval in minutes
interval = 5
endpoint = https://api.godhuli.shop/v1/pos/sync
retry_backoff = 2, 4, 8, 16

[features]
gift_messages = on
partial_refunds = off
offline_mode = yes
