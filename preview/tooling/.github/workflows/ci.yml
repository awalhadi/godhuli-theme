name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*.*.*"]
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/shop-api

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
        include:
          - os: ubuntu-latest
            node: 22
            coverage: true
        exclude:
          - os: windows-latest
            node: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: shop
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm vitest run ${{ matrix.coverage && '--coverage' || '' }}
        env:
          DATABASE_URL: postgres://postgres:shop@localhost:5432/postgres
      - name: Upload coverage
        if: ${{ matrix.coverage && !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  publish:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          docker build -f tooling/Dockerfile -t "$REGISTRY/$IMAGE_NAME:$TAG" .
          docker push "$REGISTRY/$IMAGE_NAME:$TAG"
          echo "### Published \`$TAG\` :rocket:" >> "$GITHUB_STEP_SUMMARY"
