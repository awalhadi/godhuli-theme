# ===============================================
# Godhuli Shop — Spring Boot configuration
# ===============================================
spring.application.name=godhuli-shop-orders
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}
server.servlet.context-path=/api
server.compression.enabled=true

! Datasource (secrets come from the environment)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/shop?sslmode=prefer
spring.datasource.username=${DB_USER:shop}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,\
                        classpath:db/seed

# Shop-specific settings
godhuli.shop.currency=BDT
godhuli.shop.tax-rate=0.075
godhuli.shop.max-items-per-order=50
godhuli.shop.gift-message.max-length=280
godhuli.shop.support-email=support@godhuli.shop
godhuli.shop.welcome-message=Welcome to Godhuli Shop, ${user.name}!\nEnjoy free shipping over ৳1000.
godhuli.shop.allowed-origins=https://godhuli.shop,\
    https://admin.godhuli.shop,\
    http://localhost:3000

godhuli.payments.bkash.base-url=https://tokenized.pay.bka.sh/v1.2.0-beta
godhuli.payments.bkash.app-key=${BKASH_APP_KEY}
godhuli.payments.retry.max-attempts=3

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
logging.level.root=INFO
logging.level.godhuli.shop=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{ISO8601} %-5level [%thread] %logger{36} - %msg%n
key\ with\ spaces = escaped keys are valid too
